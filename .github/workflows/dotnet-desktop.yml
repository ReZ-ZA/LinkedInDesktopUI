# Builds the .NET Framework 4.5 WinForms app in this repository.
#
# windows-latest does not include a .NET Framework 4.5 targeting pack
# (installed packs start at 4.6.2). The workflow therefore installs the
# Microsoft.NETFramework.ReferenceAssemblies.net45 reference assemblies
# before MSBuild, or the build fails with MSB3644.
#
# This repository has no unit-test project and no Windows Application
# Packaging project, so the workflow does not run tests, signing, or MSIX
# packaging.

name: .NET Framework Desktop

on:
  push:
    branches: [ "master", "copilot/fix-failing-github-actions-job" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: LinkedInDesktopUI.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Install .NET Framework 4.5 reference assemblies
      shell: pwsh
      run: |
        $ProgressPreference = "SilentlyContinue"
        $packageRoot = "C:\net45ref"
        $frameworkDir = Join-Path $packageRoot "build\.NETFramework\v4.5"
        $mscorlib = Join-Path $frameworkDir "mscorlib.dll"
        if (-not (Test-Path $mscorlib)) {
          $zip = Join-Path $env:RUNNER_TEMP "net45-ref.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net45/1.0.3" -OutFile $zip
          if (Test-Path $packageRoot) {
            Remove-Item -Recurse -Force $packageRoot
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $packageRoot
        }
        if (-not (Test-Path $mscorlib)) {
          throw "Failed to install .NET Framework 4.5 reference assemblies to $frameworkDir"
        }

        # Also install into the well-known reference-assembly location so tools
        # that do not honor TargetFrameworkRootPath can resolve v4.5.
        $destRoot = Join-Path ${env:ProgramFiles(x86)} "Reference Assemblies\Microsoft\Framework\.NETFramework"
        $dest = Join-Path $destRoot "v4.5"
        if (-not (Test-Path (Join-Path $dest "mscorlib.dll"))) {
          New-Item -ItemType Directory -Force -Path $destRoot | Out-Null
          Copy-Item -Recurse -Force $frameworkDir $dest
        }

        # No trailing separator here. GITHUB_ENV treats a trailing backslash as a line continuation.
        "TARGET_FRAMEWORK_ROOT=$packageRoot\build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    # Do not pass /p:Platform. The solution platform is "Any CPU" and MSBuild
    # maps that to the project's "AnyCPU". A global Platform property would
    # override that mapping and skip the project's configuration property groups.
    # /t:Restore is also omitted: this classic csproj has no Restore target.
    - name: Build
      shell: pwsh
      run: |
        $PSNativeCommandArgumentPassing = "Standard"
        $refRoot = $env:TARGET_FRAMEWORK_ROOT.TrimEnd('\') + '\'
        msbuild $env:Solution_Name /t:Build "/p:Configuration=$env:Configuration" "/p:TargetFrameworkRootPath=$refRoot" /p:BypassFrameworkInstallChecks=true /v:minimal
        if ($LASTEXITCODE -ne 0) {
          throw "MSBuild failed with exit code $LASTEXITCODE"
        }
        $exe = Join-Path (Join-Path "bin" $env:Configuration) "LinkedInDesktopUI.exe"
        if (-not (Test-Path $exe)) {
          throw "Expected build output was not produced: $exe"
        }
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LinkedInDesktopUI-${{ matrix.configuration }}
        path: bin/${{ matrix.configuration }}/
        if-no-files-found: error
